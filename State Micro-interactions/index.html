<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Save Button — State Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14151c;
    --bg-grid: #1a1b24;
    --panel: #1b1c26;
    --panel-2: #20212c;
    --border: #2b2c3a;
    --text: #eceaf2;
    --text-dim: #9091a3;
    --text-faint: #5c5d6e;
    --accent: #7c9eff;
    --accent-dim: #4d5f99;
    --success: #4ddba0;
    --error: #ff7085;

    --dur-press: 110ms;
    --dur-hover: 200ms;
    --dur-focus: 180ms;
    --dur-cross: 260ms;
    --dur-spin: 900ms;
    --dur-shake: 420ms;
    --dur-draw: 380ms;
    --dur-hold: 2400ms;

    --ease-out: cubic-bezier(.16,1,.3,1);
    --ease-soft: cubic-bezier(.65,0,.35,1);
    --ease-spring: cubic-bezier(.34,1.56,.64,1);
    --ease-shake: cubic-bezier(.36,.07,.19,.97);
  }

  *{ box-sizing:border-box; }

  html.motion-reduce{ --dur-spin: 1200ms; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 20% -10%, #23253244 0%, transparent 45%),
      radial-gradient(circle at 100% 10%, #7c9eff14 0%, transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', system-ui, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
  }

  .stage{
    width:100%;
    max-width:920px;
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:20px;
  }

  @media (max-width: 760px){
    .stage{ grid-template-columns: 1fr; }
  }

  header.head{
    grid-column:1/-1;
    margin-bottom:4px;
  }
  header.head h1{
    font-size:15px;
    font-weight:600;
    letter-spacing:.02em;
    margin:0 0 4px;
    color:var(--text);
  }
  header.head p{
    margin:0;
    font-size:13px;
    color:var(--text-dim);
    line-height:1.5;
    max-width:60ch;
  }

  .card, .hud{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    padding:24px;
  }

  .card{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:22px;
    min-height:280px;
  }

  /* ---------- BUTTON ---------- */

  .btn{
    position:relative;
    width:190px;
    height:52px;
    border-radius:14px;
    border:1px solid var(--accent-dim);
    background:#232437;
    color:var(--text);
    font-family:inherit;
    font-size:14.5px;
    font-weight:600;
    letter-spacing:.01em;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    outline:none;
    transition:
      background-color var(--dur-hover) var(--ease-soft),
      border-color var(--dur-hover) var(--ease-soft),
      transform var(--dur-press) var(--ease-out),
      opacity var(--dur-focus) var(--ease-soft),
      filter var(--dur-focus) var(--ease-soft);
    transform: translateY(0) scale(1);
  }

  .btn:hover:not(.is-disabled){
    background:#282a40;
    border-color:var(--accent);
    transform: translateY(-1px) scale(1);
  }
  .btn:active:not(.is-disabled){
    transform: translateY(0) scale(.97);
    transition-duration: var(--dur-press);
  }
  html.motion-reduce .btn:hover:not(.is-disabled),
  html.motion-reduce .btn:active:not(.is-disabled){
    transform:none;
  }

  /* glow layer — compositor-friendly hover feedback via opacity, not box-shadow */
  .btn-glow{
    position:absolute;
    inset:-10px;
    border-radius:20px;
    background: radial-gradient(circle, #7c9eff33 0%, transparent 70%);
    opacity:0;
    pointer-events:none;
    transition: opacity var(--dur-hover) var(--ease-soft);
  }
  .btn:hover:not(.is-disabled) .btn-glow{ opacity:1; }

  /* focus ring — own layer, animates in on keyboard focus only */
  .focus-ring{
    position:absolute;
    inset:-5px;
    border-radius:18px;
    border:2px solid var(--accent);
    opacity:0;
    transform:scale(.92);
    pointer-events:none;
    transition: opacity var(--dur-focus) var(--ease-out), transform var(--dur-focus) var(--ease-out);
  }
  .btn:focus-visible .focus-ring{
    opacity:1;
    transform:scale(1);
  }
  html.motion-reduce .btn:focus-visible .focus-ring{ transform:none; }

  .btn.is-disabled{
    cursor:not-allowed;
    opacity:.45;
    filter:grayscale(.4);
  }
  .btn.is-disabled .btn-glow{ opacity:0 !important; }

  /* ---------- content: fixed box, layers crossfade (no width/height animation) ---------- */

  .btn-content{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
  }

  .icon-layer, .label-layer{
    position:absolute;
    left:0; right:0;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    transform:scale(.9);
    transition: opacity var(--dur-cross) var(--ease-soft), transform var(--dur-cross) var(--ease-soft);
    pointer-events:none;
  }
  html.motion-reduce .icon-layer, html.motion-reduce .label-layer{ transform:none; }

  .btn-content{ gap:0; }
  .icon-layer{ width:20px; height:20px; left:calc(50% - 62px); }
  .label-layer{ left:0; padding-left:34px; justify-content:center; white-space:nowrap; }

  .icon-layer[data-active="true"], .label-layer[data-active="true"]{
    opacity:1;
    transform:scale(1);
  }

  .icon-layer svg{ width:20px; height:20px; display:block; }

  /* idle icon: bookmark/save glyph */
  .icon-idle path{ stroke:var(--accent); }

  /* spinner */
  .spinner-ring{
    width:18px; height:18px;
    border-radius:50%;
    border:2px solid #4d5f99;
    border-top-color: var(--accent);
    animation: spin var(--dur-spin) linear infinite;
  }
  html.motion-reduce .spinner-ring{
    animation: pulse-op 1.1s ease-in-out infinite;
    border-top-color:#4d5f99;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes pulse-op{ 0%,100%{ opacity:.35 } 50%{ opacity:1 } }

  /* success check draw */
  .check-path{
    fill:none;
    stroke:var(--success);
    stroke-width:2.5;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray:24;
    stroke-dashoffset:24;
  }
  .icon-layer[data-active="true"] .check-path{
    animation: draw var(--dur-draw) var(--ease-out) forwards;
  }
  html.motion-reduce .icon-layer[data-active="true"] .check-path{
    animation: draw-fast .18s linear forwards;
  }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  @keyframes draw-fast{ to{ stroke-dashoffset:0; } }

  .x-path{ stroke:var(--error); stroke-width:2.5; stroke-linecap:round; }

  .btn.state-success{ border-color:#2f7a5c; }
  .btn.state-error{ border-color:#8a3a45; }
  .btn.state-loading{ border-color:var(--accent-dim); }

  /* error shake — one-shot, restartable */
  .btn.shake:not(.is-disabled){
    animation: shake var(--dur-shake) var(--ease-shake);
  }
  html.motion-reduce .btn.shake{ animation:none; }
  @keyframes shake{
    10%,90%{ transform:translateX(-1px); }
    20%,80%{ transform:translateX(2px); }
    30%,50%,70%{ transform:translateX(-4px); }
    40%,60%{ transform:translateX(4px); }
  }

  /* success pop — one-shot, restartable */
  .btn.pop:not(.is-disabled){
    animation: pop 340ms var(--ease-spring);
  }
  html.motion-reduce .btn.pop{ animation:none; }
  @keyframes pop{
    0%{ transform:scale(1); }
    45%{ transform:scale(1.045); }
    100%{ transform:scale(1); }
  }

  /* ---------- controls ---------- */
  .controls{
    display:flex;
    flex-direction:column;
    gap:10px;
    font-size:12.5px;
    color:var(--text-dim);
    width:100%;
    max-width:260px;
  }
  .controls .row{ display:flex; align-items:center; gap:8px; }
  .controls fieldset{
    border:1px solid var(--border);
    border-radius:10px;
    padding:8px 10px;
    display:flex;
    gap:14px;
    margin:0;
  }
  .controls legend{ padding:0 4px; color:var(--text-faint); font-size:11px; }
  .controls label{ display:flex; align-items:center; gap:6px; cursor:pointer; }
  .controls input[type="checkbox"], .controls input[type="radio"]{ accent-color:var(--accent); }

  /* ---------- HUD ---------- */
  .hud{
    display:flex;
    flex-direction:column;
    gap:12px;
    font-family:'JetBrains Mono', ui-monospace, monospace;
  }
  .hud h2{
    font-family:'Inter', sans-serif;
    font-size:12px;
    font-weight:600;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin:0 0 2px;
  }
  .hud-current{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
  }
  .hud-dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--accent);
    transition: background-color var(--dur-hover) var(--ease-soft);
  }
  .hud-log{
    display:flex;
    flex-direction:column;
    gap:8px;
    max-height:340px;
    overflow-y:auto;
  }
  .hud-entry{
    border:1px solid var(--border);
    background:var(--panel-2);
    border-radius:10px;
    padding:10px 12px;
    font-size:11.5px;
    line-height:1.55;
    opacity:0;
    transform:translateY(-4px);
    animation: entry-in 320ms var(--ease-out) forwards;
  }
  html.motion-reduce .hud-entry{ animation: entry-in-fast 140ms linear forwards; }
  @keyframes entry-in{ to{ opacity:1; transform:translateY(0); } }
  @keyframes entry-in-fast{ to{ opacity:1; transform:none; } }
  .hud-entry .t{ color:var(--accent); font-weight:500; }
  .hud-entry .spec{ color:var(--text-dim); display:block; margin-top:3px; }
  .hud-entry .why{ color:var(--text-faint); display:block; margin-top:5px; font-style:italic; }
</style>
</head>
<body>

<div class="stage">
  <header class="head">
    <h1>Save button — state lab</h1>
    <p>Every transition below is chosen on purpose. Click the button, hover mid-animation, spam it, tab to it — the log on the right explains what's animating and why.</p>
  </header>

  <div class="card">
    <button id="btn" class="btn state-idle" type="button" aria-live="polite">
      <span class="focus-ring"></span>
      <span class="btn-glow"></span>
      <span class="btn-content">

        <span class="icon-layer icon-idle" data-icon="idle" data-active="true">
          <svg viewBox="0 0 20 20" fill="none"><path d="M5 3.5h10a1 1 0 0 1 1 1V17l-6-3.4-6 3.4V4.5a1 1 0 0 1 1-1Z" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </span>
        <span class="icon-layer" data-icon="loading" data-active="false">
          <span class="spinner-ring"></span>
        </span>
        <span class="icon-layer" data-icon="success" data-active="false">
          <svg viewBox="0 0 20 20"><path class="check-path" d="M4 10.5l4 4 8-9"/></svg>
        </span>
        <span class="icon-layer" data-icon="error" data-active="false">
          <svg viewBox="0 0 20 20"><path class="x-path" d="M6 6l8 8M14 6l-8 8" stroke-linecap="round"/></svg>
        </span>

        <span class="label-layer" data-label="idle" data-active="true">Save changes</span>
        <span class="label-layer" data-label="loading" data-active="false">Saving…</span>
        <span class="label-layer" data-label="success" data-active="false">Saved</span>
        <span class="label-layer" data-label="error" data-active="false">Try again</span>

      </span>
    </button>

    <div class="controls">
      <fieldset>
        <legend>next result</legend>
        <label><input type="radio" name="outcome" value="success" checked> succeed</label>
        <label><input type="radio" name="outcome" value="error"> fail</label>
      </fieldset>
      <div class="row">
        <label><input type="checkbox" id="disabledToggle"> Disabled state</label>
      </div>
      <div class="row">
        <label><input type="checkbox" id="motionToggle"> Force reduced motion</label>
      </div>
    </div>
  </div>

  <div class="hud">
    <div>
      <h2>Live state</h2>
      <div class="hud-current"><span class="hud-dot" id="hudDot"></span><span id="hudState">idle</span></div>
    </div>
    <div class="hud-log" id="hudLog"></div>
  </div>
</div>

<script>
(function(){
  const btn = document.getElementById('btn');
  const hudLog = document.getElementById('hudLog');
  const hudState = document.getElementById('hudState');
  const hudDot = document.getElementById('hudDot');
  const disabledToggle = document.getElementById('disabledToggle');
  const motionToggle = document.getElementById('motionToggle');

  const icons = btn.querySelectorAll('.icon-layer');
  const labels = btn.querySelectorAll('.label-layer');

  let current = 'idle';
  let revertTimer = null;
  let pendingResult = null;
  let hoveringDuringHold = false;

  const dotColor = { idle:'#7c9eff', loading:'#7c9eff', success:'#4ddba0', error:'#ff7085' };

  const SPECS = {
    idle: 'baseline — no transition running',
    loading: 'opacity+scale crossfade, 260ms ease-in-out · spinner: transform rotate, 900ms linear ∞',
    success: 'crossfade 260ms ease-in-out · check stroke-dashoffset 380ms ease-out · button pop 340ms spring',
    error: 'crossfade 260ms ease-in-out · button shake (translateX) 420ms sharp-ease',
    revert: 'crossfade 320ms ease-in-out back to idle'
  };
  const WHY = {
    idle: 'resting state — width/height never change, only content layers, so nothing else on the page reflows.',
    loading: 'linear + infinite tells the eye "ongoing", not "almost done". Crossfade instead of a width squeeze avoids layout thrash.',
    success: 'the spring gives a half-pixel overshoot — reads as a small win without being silly. Check draws in, doesn\\'t just appear.',
    error: 'shake amplitude capped under 5px so it reads as emphasis, not chaos. Sharp ease-in-out mimics a quick head-shake.',
    revert: 'held for 2.4s so the message is actually readable, then eases back. Hovering pauses the timer — you shouldn\\'t lose your result while reading it.'
  };

  function log(stateKey, extra){
    const el = document.createElement('div');
    el.className = 'hud-entry';
    el.innerHTML = `<span class="t">${extra || stateKey}</span><span class="spec">${SPECS[stateKey]}</span><span class="why">${WHY[stateKey]}</span>`;
    hudLog.prepend(el);
    while (hudLog.children.length > 6) hudLog.removeChild(hudLog.lastChild);
  }

  function setActive(state){
    icons.forEach(el => el.dataset.active = (el.dataset.icon === state) ? 'true' : 'false');
    labels.forEach(el => el.dataset.active = (el.dataset.label === state) ? 'true' : 'false');
  }

  function restartAnim(el, cls){
    el.classList.remove(cls);
    void el.offsetWidth; // force reflow so the animation can restart cleanly
    el.classList.add(cls);
  }

  function goto(state, opts){
    opts = opts || {};
    clearTimeout(revertTimer);
    btn.classList.remove('state-idle','state-loading','state-success','state-error');
    btn.classList.add('state-' + state);
    setActive(state);
    current = state;
    hudState.textContent = state;
    hudDot.style.background = dotColor[state];
    log(state);

    if (state === 'success') restartAnim(btn, 'pop');
    if (state === 'error') restartAnim(btn, 'shake');

    if (state === 'success' || state === 'error'){
      scheduleRevert();
    }
  }

  function scheduleRevert(){
    clearTimeout(revertTimer);
    revertTimer = setTimeout(() => {
      if (hoveringDuringHold) { scheduleRevert(); return; } // interrupted by hover — don't yank it away
      log('revert', 'auto-reset');
      goto('idle');
    }, 2400);
  }

  btn.addEventListener('mouseenter', () => {
    hoveringDuringHold = (current === 'success' || current === 'error');
  });
  btn.addEventListener('mouseleave', () => {
    hoveringDuringHold = false;
  });

  btn.addEventListener('click', () => {
    if (btn.classList.contains('is-disabled')) return;
    if (current === 'loading') return; // ignore spam-clicks mid-flight, don't restart the async op
    const outcome = document.querySelector('input[name="outcome"]:checked').value;
    goto('loading');
    clearTimeout(revertTimer);
    revertTimer = setTimeout(() => goto(outcome), 1400);
  });

  disabledToggle.addEventListener('change', () => {
    btn.classList.toggle('is-disabled', disabledToggle.checked);
    btn.setAttribute('aria-disabled', disabledToggle.checked ? 'true' : 'false');
    log('idle', disabledToggle.checked ? 'disabled' : 'enabled');
  });

  function applyMotionPref(){
    const reduce = motionToggle.checked || window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    document.documentElement.classList.toggle('motion-reduce', reduce);
  }
  motionToggle.addEventListener('change', applyMotionPref);
  window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', applyMotionPref);
  applyMotionPref();

  log('idle', 'ready');
})();
</script>

</body>
</html>
